services:
  ntl-systoolbox:
    image: alorthios/ntl-systoolbox:3.1.0
    container_name: ntl-systoolbox
    
    # Mode réseau : host pour accès réseau direct (nmap)
    network_mode: host
    
    # Capacités pour nmap (raw sockets)
    cap_add:
      - NET_RAW
      - NET_ADMIN
    
    # Volumes
    volumes:
      # Bind mount pour le fichier .env (depuis l'hôte)
      - ./.env:/app/.env
      # Bind mount pour les exports (dans le dossier local)
      - ./exports:/app/exports
